spring.application.name=nextcalendar-test

# Banco em memória (H2). O schema é gerado pelo Hibernate (create-drop) a partir
# das entidades JPA — as migrations do Flyway são específicas de PostgreSQL
# (ON CONFLICT, BYTEA, INTERVAL '30 days') e não rodam no H2, então o Flyway
# fica desabilitado nos testes. Os testes criam seus próprios dados
# (@Transactional com rollback) e não dependem do seed das migrations.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=false

jwt.secret=nextcalendar-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration-ms=86400000
