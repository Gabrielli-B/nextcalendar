spring.application.name=nextcalendar

# ── Datasource — PostgreSQL ──────────────────────────────────────────────────
# Configure as variáveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD.
# Exemplo local: jdbc:postgresql://localhost:5432/nextcalendar
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nextcalendar}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate valida o schema (Flyway é responsável por criá-lo/migrá-lo).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ───────────────────────────────────────────────────────────────────
# Os seeds (estabelecimento + usuários, UUIDs fixos) estão em
# db/migration/V2__seed_default_establishment.sql e V3__seed_studio_vision.sql
# baseline-on-migrate=true: permite rodar em schema pré-existente
# baseline-version=0: garante que a migration V1 seja executada após o baseline
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.sql.init.mode=never

# JWT — troque o secret em produção por uma variável de ambiente
jwt.secret=nextcalendar-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration-ms=86400000

# ── Erros HTTP ───────────────────────────────────────────────────────────────
# Nunca expor stack trace no corpo da resposta (vazamento de detalhes internos).
# Nota: no Spring Boot 4 o prefixo é spring.web.error (não server.error).
spring.web.error.include-stacktrace=never
